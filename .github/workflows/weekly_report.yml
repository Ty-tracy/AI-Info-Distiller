name: AI Customized Info Distiller

on:
  workflow_dispatch:
    inputs:
      topic:
        description: '请选择你要推送的频道'
        required: true
        default: '宏观政策'
        type: choice
        options:
        - 宏观政策
        - 观点与实践
        - 财经洞察
        - 社会情绪
        - 娱乐解压
  schedule:
    - cron: '0 23 * * 0' # 默认每周一早上7点（北京时间）跑一次“宏观政策”

jobs:
  build_and_run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 注意这行，已经加上了 beautifulsoup4
          pip install requests feedparser openai beautifulsoup4

      - name: Run AI Pipeline Script
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        # 这里把下拉菜单选的值传给 Python 脚本
        run: python main.py ${{ github.event.inputs.topic || '宏观政策' }}
